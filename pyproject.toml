
[project]
name = "pycaruna"
version = "1.1.0"
description = "Caruna+ API client (fork of Jalle19/pycaruna for the 2026 API)"
readme = "README.md"
authors = [
    {name = "Sam Stenvall", email = "neggelandia@gmail.com"},
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.9",
    "lxml>=4.6",
    "requests>=2",
]

[project.urls]
Homepage = "https://github.com/prosenstrom/pycaruna"
"Bug Tracker" = "https://github.com/prosenstrom/pycaruna/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
test = [
    "pytest>=7",
    "pytest-cov>=7.1.0",
]
lint = [
    "bandit[toml]>=1.8",
    "ruff>=0.12",
    "ty>=0.0.70",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
]

[tool.uv]
default-groups = ["dev"]
package = true

[tool.setuptools]
packages = ["pycaruna"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=pycaruna",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[tool.coverage.run]
source_pkgs = ["pycaruna"]
branch = false

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py312"
src = ["pycaruna"]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "UP",
    "W",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["pycaruna"]

[tool.bandit]
exclude_dirs = ["tests", "examples"]

[tool.ty.src]
include = ["pycaruna", "tests"]
